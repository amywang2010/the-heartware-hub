<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heartware studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #efe9e1; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

/* ============================================================================
   HEARTWARE STUDIO
   A single chestpiece modelling the retrofit: the stock cup and rim, and the
   insert that replaces the back plate and hangs 14 mm behind it.

   Millimetres throughout, scaled by 0.1 at the camera. 43.4 mm head, 38.9 mm
   seat, 3 mm acoustic port, 14 mm insert. Nothing is imported from viz/.
   ========================================================================== */

const P = new URLSearchParams(location.search);
const VIEW = P.get('view') || 'hero';
const W = Number(P.get('w') || 1600);
const H = Number(P.get('h') || 1400);
const TURN = Number(P.get('turn') || 0);
const EXPLODE = Number(P.get('explode') || 0);
const HIDE = (P.get('hide') || '').split(',').filter(Boolean);
const CUT = P.get('cut') === '1';
const EMBED = P.get('embed') === '1';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
/* White seamless, the way a catalogue shoots a part whose finish is not yet
   settled. The grey gradient this replaced read as a Blender default no matter
   how carefully it was lit; on white there is nothing to read as a backdrop. */
scene.background = (() => {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, 1024);
  bg.addColorStop(0.00, '#ffffff');
  bg.addColorStop(0.60, '#fbfbfc');
  bg.addColorStop(1.00, '#eceeef');
  g.fillStyle = bg; g.fillRect(0, 0, 1024, 1024);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
scene.environmentIntensity = 0.55;

/* ---------- textures ---------------------------------------------------- */
function canvas(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* Concentric turning marks, for the turned faces. A machined part shows them
   and a smooth gradient does not; they are drawn as rings, low contrast, so
   they read as a finish and never as a printed pattern. */
const turnTex = canvas(1024, (g, s) => {
  g.fillStyle = '#8a8a8a';
  g.fillRect(0, 0, s, s);
  for (let r = 3; r < s * 0.72; r += 2.4) {
    g.strokeStyle = `rgba(255,255,255,${0.05 + 0.05 * ((r * 7) % 3) / 2})`;
    g.lineWidth = 1;
    g.beginPath();
    g.arc(s / 2, s / 2, r, 0, 7);
    g.stroke();
  }
});
turnTex.wrapS = turnTex.wrapT = THREE.ClampToEdgeWrapping;

/* The boards and the cell carry no printed artwork. Every earlier still had a
   silkscreen label and a printed cell wrap baked into a 1024 px texture, mapped
   onto a 30 mm disc at an oblique angle: at render size that aliased into a
   radial fan of lines that read as a printed grille, not as a circuit board.
   A part this small shows its copper and its component bodies, not a label. */
/* ---------- materials --------------------------------------------------- */
const M = {
  polished: new THREE.MeshStandardMaterial({ color: 0xe9eaec, metalness: 1.0, roughness: 0.09, envMapIntensity: 1.35 }),
  brushed: new THREE.MeshStandardMaterial({ color: 0xc6c9cd, metalness: 1.0, roughness: 0.38, envMapIntensity: 0.95 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xc9ccd0, metalness: 1.0, roughness: 0.34, envMapIntensity: 1.0 }),
  /* the turned insert body: bead-blasted and anodised aluminium, not chrome.
     DoubleSide because a lathe profile is a single surface and the winding of
     this one faces inward, which left the walls invisible and the boards on
     show through the part. */
  /* graphite anodised aluminium: a machined part with a settled finish, not
     raw bead-blast, which on a white sweep reads as grey plastic */
  bead: new THREE.MeshStandardMaterial({
    color: 0x33383d, metalness: 0.85, roughness: 0.38, envMapIntensity: 1.0,
    side: THREE.DoubleSide
  }),
  beadFace: new THREE.MeshStandardMaterial({
    color: 0x33383d, metalness: 0.85, roughness: 0.38, envMapIntensity: 1.0,
    roughnessMap: turnTex, side: THREE.DoubleSide
  }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x24252a, metalness: 0.0, roughness: 0.72 }),
  membrane: new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.05, transmission: 0.99, thickness: 0.05,
    ior: 1.48, transparent: true, opacity: 0.09, clearcoat: 1, clearcoatRoughness: 0.03,
    side: THREE.DoubleSide, envMapIntensity: 1.8
  }),
  shell: new THREE.MeshPhysicalMaterial({ color: 0xf1eee7, metalness: 0.0, roughness: 0.52, clearcoat: 0.12, clearcoatRoughness: 0.45 }),
  shellMatte: new THREE.MeshStandardMaterial({ color: 0xdedad2, metalness: 0.0, roughness: 0.68 }),
  red: new THREE.MeshStandardMaterial({ color: 0xb0102a, metalness: 0.0, roughness: 0.52 }),
  tube: new THREE.MeshPhysicalMaterial({ color: 0x2b2c30, metalness: 0.0, roughness: 0.62, clearcoat: 0.22, clearcoatRoughness: 0.5 }),
  pcb: new THREE.MeshStandardMaterial({ color: 0x1e2b26, roughness: 0.66, metalness: 0.15 }),
  chip: new THREE.MeshStandardMaterial({ color: 0x0f1113, metalness: 0.4, roughness: 0.42 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xbf9b60, metalness: 1.0, roughness: 0.34 }),
  cell: new THREE.MeshStandardMaterial({ color: 0xe3e0d9, roughness: 0.58, metalness: 0.12 }),
  led: new THREE.MeshPhysicalMaterial({
    color: 0x3a0c14, emissive: 0x6e1220, emissiveIntensity: 0.5, roughness: 0.12,
    clearcoat: 1, clearcoatRoughness: 0.06
  })
};

function lathe(profile, mat, seg = 160) {
  const m = new THREE.Mesh(
    new THREE.LatheGeometry(profile.map(([x, y]) => new THREE.Vector2(x, y)), seg),
    mat
  );
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function disc(r, h, mat, y) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 160), mat);
  m.position.y = y;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
/* A flat face of a turned part, as its own geometry.
   A closed lathe profile that runs to x = 0 collapses every vertex of that ring
   onto the axis; the normals at that ring come out radial, and under a metal or
   clearcoated material they render as a sunburst of streaks across the face.
   That artifact was on the acoustic base and the lid, and it is what made the
   part look like it had a printed fan grille. Faces are circles now. */
/* An annular face: the top of a threaded collar is a ring, not a disc, and it
   has to exist or the part reads as an open tube with rings hovering in it. */
function ring(rOuter, rInner, y, mat, up = true) {
  const m = new THREE.Mesh(new THREE.RingGeometry(rInner, rOuter, 160, 1), mat);
  m.rotation.x = up ? -Math.PI / 2 : Math.PI / 2;
  m.position.y = y;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function face(r, y, mat, up = true) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 160), mat);
  m.rotation.x = up ? -Math.PI / 2 : Math.PI / 2;
  m.position.y = y;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ---------- the stock head ---------------------------------------------- */
const R = 21.7;        // 43.4 mm across
const SEAT = 19.45;    // 38.9 mm seat
const stock = new THREE.Group();

// polymer rim: a thin moulded lip at the edge of the face
stock.add(lathe([
  [19.5, 0.35],
  [20.6, 0.15],
  [21.6, -0.6],
  [21.9, -1.5],
  [21.5, -2.4],
  [20.6, -2.9],
  [20.2, -2.2],
  [20.2, -1.2],
  [19.5, -0.9],
  [19.5, 0.35]
], M.rubber));

// cup: tapers from the face to the back where the insert seats
stock.add(lathe([
  [20.2, -2.4],
  [21.2, -3.3],
  [21.1, -6.4],
  [20.4, -9.6],
  [19.2, -11.6],
  [18.4, -12.7],
  [17.4, -12.7],
  [18.4, -11.4],
  [19.5, -9.4],
  [19.8, -3.4],
  [20.2, -2.4]
], M.brushed));

// polished reflector behind the diaphragm
stock.add(disc(19.4, 0.5, M.polished, -1.6));

// diaphragm: a thin, nearly flat membrane so the reflector reads through it
const membrane = new THREE.Mesh(new THREE.CircleGeometry(19.7, 128), M.membrane);
membrane.rotation.x = -Math.PI / 2;
membrane.position.y = -0.45;
stock.add(membrane);

// stem, angled off the side, with the tube socket
const stem = new THREE.Group();
const stemBody = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 3.9, 13, 64), M.brushed);
stemBody.position.y = -6.5;
stemBody.castShadow = true;
stem.add(stemBody);
const socket = new THREE.Mesh(new THREE.CylinderGeometry(4.9, 4.9, 3.4, 64), M.steel);
socket.position.y = -12.4;
socket.castShadow = true;
stem.add(socket);
const tubeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, -13.0, 0),
  new THREE.Vector3(0.6, -21, 1.4),
  new THREE.Vector3(4.2, -30, 3.4),
  new THREE.Vector3(12.5, -38, 6.0),
  new THREE.Vector3(26, -42, 9.0),
  new THREE.Vector3(44, -40, 12.0),
  new THREE.Vector3(62, -33, 15.0)
], false, 'centripetal');
const tubeMesh = new THREE.Mesh(new THREE.TubeGeometry(tubeCurve, 220, 4.5, 28, false), M.tube);
tubeMesh.castShadow = true;
tubeMesh.receiveShadow = true;
stem.add(tubeMesh);

const tubeCollar = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.0, 5.2, 64), M.rubber);
tubeCollar.position.y = -14.6;
tubeCollar.castShadow = true;
stem.add(tubeCollar);

stem.position.set(R - 4.4, -7.4, 0);
stem.rotation.z = Math.PI * 0.36;
stock.add(stem);

/* ---------- the insert --------------------------------------------------- */
/* Two groups: the body, which is what a customer sees and what the cutaway
   sections, and the internals, which are only ever visible through a section.
   The earlier model stacked every layer as a full exposed disc, so the boards
   and the cell read as black gaskets in a pancake. A real insert is a closed
   turned body with a seam and four screws; you do not see its electronics. */
const insert = new THREE.Group();
const insertShell = new THREE.Group();
const insertCore = new THREE.Group();
insert.add(insertShell, insertCore);

// threaded collar that takes the place of the stock back plate
insertShell.add(lathe([
  [18.9, -12.7],
  [18.9, -16.0],
  [18.2, -16.9]
], M.bead));
/* the thread itself: four shallow turns cut into the collar, in the same
   anodised finish. Polished steel here read as a coil of wire lying on the
   part, which is the one thing a thread must not look like. */
for (let i = 0; i < 4; i++) {
  const t = new THREE.Mesh(new THREE.TorusGeometry(18.94, 0.3, 8, 140), M.bead);
  t.rotation.x = Math.PI / 2;
  t.position.y = -13.15 - i * 0.72;
  t.castShadow = true;
  insertShell.add(t);
}

/* the collar's top face: a closed annulus between the port and the outer rim,
   so the part is solid from above instead of an open cup */
insertShell.add(ring(18.9, 1.9, -12.7, M.beadFace));

// upper body: bead-blasted aluminium, turned, chamfered at both ends
insertShell.add(lathe([
  [18.55, -16.9],
  [18.6, -17.4],
  [18.6, -19.5]
], M.bead));
insertShell.add(lathe([
  [18.6, -19.8],
  [18.6, -25.5],
  [18.0, -26.3]
], M.bead));
insertShell.add(face(18.6, -16.9, M.bead));

// the seam between the two turned halves, and the base plate that closes it
const seam = new THREE.Mesh(new THREE.TorusGeometry(18.58, 0.3, 10, 160), M.rubber);
seam.rotation.x = Math.PI / 2;
seam.position.y = -19.65;
insertShell.add(seam);
insertShell.add(disc(18.0, 0.4, M.beadFace, -26.5));
// a turned relief groove just inside the rim, the way a machined base closes
const relief = new THREE.Mesh(new THREE.TorusGeometry(16.0, 0.18, 8, 160), M.rubber);
relief.rotation.x = Math.PI / 2;
relief.position.y = -26.72;
insertShell.add(relief);

// four recessed hex screws in the base plate
for (let i = 0; i < 4; i++) {
  const a = Math.PI / 4 + (i / 4) * Math.PI * 2;
  const s = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.5, 6), M.steel);
  s.position.set(Math.cos(a) * 14.6, -26.55, Math.sin(a) * 14.6);
  insertShell.add(s);
}

// single indicator lens, not a painted ring around the whole face
const lensBezel = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.28, 10, 64), M.rubber);
lensBezel.rotation.x = Math.PI / 2;
lensBezel.position.y = -26.71;
insertShell.add(lensBezel);
insertShell.add(face(2.05, -26.71, M.led, false));

// 3 mm acoustic port through the top face, with the red seal around it
const port = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 7.7, 32), M.rubber);
port.position.y = -16.55;
insertShell.add(port);
const portLip = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.45, 16, 64), M.red);
portLip.rotation.x = Math.PI / 2;
portLip.position.y = -12.75;
insertShell.add(portLip);

/* internals -- visible only when the body is sectioned */
const micBoard = disc(15.4, 0.8, M.pcb, -20.3);
insertCore.add(micBoard);
[-6.6, 6.6].forEach((x) => {
  const mic = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 2.8), M.steel);
  mic.position.set(x, -21.0, 1.6);
  mic.castShadow = true;
  insertCore.add(mic);
});
const cavityWell = new THREE.Mesh(new THREE.CylinderGeometry(4.4, 4.4, 2.0, 48, 1, true), M.shellMatte);
cavityWell.position.y = -20.8;
insertCore.add(cavityWell);

// cell
insertCore.add(disc(14.2, 2.6, M.cell, -22.9));
insertCore.add(disc(14.35, 0.3, M.steel, -21.5));
insertCore.add(disc(14.35, 0.3, M.steel, -24.3));

// main board
insertCore.add(disc(15.4, 0.8, M.pcb, -24.9));
const soc = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.85, 6.4), M.chip);
soc.position.y = -25.5;
soc.castShadow = true;
insertCore.add(soc);
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const c = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 0.5), M.gold);
  c.position.set(Math.cos(a) * 10.2, -25.4, Math.sin(a) * 10.2);
  c.rotation.y = -a;
  insertCore.add(c);
}
/* no printed logo anywhere: at this size an applied decal reads as a sticker,
   and a lasered mark is not resolved at the size these images are shown */

/* ---------- assembly ----------------------------------------------------- */
const assembly = new THREE.Group();
assembly.add(stock);
assembly.add(insert);

/* The exploded view is not rendered. Two attempts to spread the stack
   procedurally (by child index, then by bounding-box height) both tore the
   assembly apart, because the parts live under nested groups with their own
   transforms. A real exploded drawing needs an authored offset per part, which
   this model does not have yet. The stills use the underside view instead. */

assembly.rotation.y = TURN * Math.PI * 2;
assembly.rotation.z = -0.03;
scene.add(assembly);

/* ---------- the two things the page actually needs ------------------------ */
/* 1. The insert has to be visible. Under the stock cup it is hidden by the
      diaphragm, which is why every earlier still showed a stethoscope head and
      no product. `hide=stock` removes the stock; `cut=1` keeps it and slices
      the front half away so the insert is seen in place. */
if (HIDE.includes('stock')) stock.visible = false;

if (CUT) {
  renderer.localClippingEnabled = true;
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
  /* the stock and the insert body are sectioned; the internals are not, so the
     section shows the boards inside the part instead of an empty shell */
  [stock, insertShell].forEach((grp) =>
    grp.traverse((o) => {
      if (!o.isMesh) return;
      o.material = o.material.clone();
      o.material.clippingPlanes = [plane];
      o.material.side = THREE.DoubleSide;
      o.material.clipShadows = true;
    })
  );
}

/* ---------- lighting ----------------------------------------------------- */
const key = new THREE.DirectionalLight(0xfffaf2, 3.0);
key.position.set(-34, 58, 42);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 260;
key.shadow.camera.left = -60;
key.shadow.camera.right = 60;
key.shadow.camera.top = 70;
key.shadow.camera.bottom = -70;
key.shadow.bias = -0.0003;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xe9eef7, 1.2);
fill.position.set(58, 16, 30);
scene.add(fill);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.9);
rimLight.position.set(10, 30, -50);
scene.add(rimLight);

const under = new THREE.DirectionalLight(0xfff2e6, 0.35);
under.position.set(-10, -40, 20);
scene.add(under);

scene.add(new THREE.HemisphereLight(0xf2f4f7, 0x8c8a85, 0.85));

// a bright softbox above, for the long specular streak that metal needs
const softbox = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 26),
  new THREE.MeshBasicMaterial({ color: 0xf7f6f3 })
);
softbox.position.set(-6, 88, 22);
softbox.rotation.x = Math.PI / 2.4;
scene.add(softbox);

/* ---------- shadow catcher ------------------------------------------------ */
const table = new THREE.Mesh(
  new THREE.PlaneGeometry(1600, 1600),
  new THREE.MeshStandardMaterial({ color: 0xf0f1f2, roughness: 0.92, metalness: 0.0 })
);
table.rotation.x = -Math.PI / 2;
/* the insert is 14 mm shallower than the head, so it needs its own table height
   or it hangs above the surface in the views that drop the stock */
table.position.y = HIDE.includes('stock') ? -26.75 : -29.2;
table.receiveShadow = true;
if (HIDE.includes('table')) table.visible = false;
scene.add(table);

const blob = canvas(512, (g, s) => {
  const grad = g.createRadialGradient(s / 2, s / 2, 8, s / 2, s / 2, s / 2);
  grad.addColorStop(0, 'rgba(0,0,0,0.34)');
  grad.addColorStop(0.5, 'rgba(0,0,0,0.12)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
});
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(180, 180),
  new THREE.MeshBasicMaterial({ map: blob, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = HIDE.includes("stock") ? -26.7 : -29.1;
if (HIDE.includes('stock')) softShadow.visible = false;
scene.add(softShadow);

/* ---------- camera -------------------------------------------------------- */
const camera = new THREE.PerspectiveCamera(24, W / H, 1, 900);
const positions = {
  hero:      { pos: [96, 40, 150],  fov: 26, target: [0, -8, 0] },
  macro:     { pos: [46, -4, 84],   fov: 20, target: [0, -16, 0] },
  installed: { pos: [-64, 40, 118], fov: 24, target: [2, -8, 0] },
  /* the insert on its own: the part the page sells, with nothing hiding it */
  unit:      { pos: [86, -40, 88],  fov: 26, target: [0, -21, 0] },
  /* straight down on the lid: port, LED ring, collar thread. A different
     picture, not the same part at another angle. */
  detail:    { pos: [30, -70, 58],  fov: 20, target: [0, -22, 0] },
  unitlow:   { pos: [54, -44, 74],  fov: 30, target: [0, -22, 0] },
  /* half the chestpiece removed, so the insert is visible in place */
  cut:       { pos: [88, 22, 126],  fov: 21, target: [0, -19, 0] },
  /* composed for a 2.6:1 band across the top of the home page, not a crop of
     a 4:3 frame */
  band:      { pos: [96, 30, 138],  fov: 14, target: [0, -17, 0] },
  back:      { pos: [8, 96, 54],    fov: 24, target: [0, -14, 0] }
};const cfg = positions[VIEW] || positions.hero;
camera.position.set(...cfg.pos);
camera.fov = cfg.fov;
camera.lookAt(new THREE.Vector3(...cfg.target));
camera.updateProjectionMatrix();

/* ---------- depth pass ---------------------------------------------------- */
/* A depth map so the stills can be focus-blurred after the fact. Linear view
   depth, normalised to the range the camera actually spans here. */
const depthMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying float vD;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vD = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vD;
    void main() {
      float d = clamp((vD - 40.0) / 240.0, 0.0, 1.0);
      gl_FragColor = vec4(d, d, d, 1.0);
    }`
});

if (P.get('depth')) {
  const bg = scene.background;
  scene.background = null;
  scene.overrideMaterial = depthMat;
  renderer.setClearColor(0xffffff, 1);
  renderer.render(scene, camera);
  renderer.setClearColor(0x000000, 1);
  window.__ready = true;
} else if (EMBED) {
  /* Live viewer on the product page: drag to turn, wheel-free, no chrome. */
  const fit = () => {
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  };
  fit();
  addEventListener('resize', fit);
  document.body.style.cursor = 'grab';
  let down = false, lastX = 0, lastY = 0, vel = 0, rotY = assembly.rotation.y, rotX = -0.06;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (e) => {
    down = true; lastX = e.clientX; lastY = e.clientY;
    document.body.style.cursor = 'grabbing';
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!down) return;
    vel = (e.clientX - lastX) * 0.006;
    rotY += vel;
    rotX = Math.max(-0.5, Math.min(0.45, rotX + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  const up = () => { down = false; document.body.style.cursor = 'grab'; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  assembly.rotation.x = rotX;
  assembly.rotation.y = rotY;
  const tick = () => {
    if (!down) { vel *= 0.94; rotY += vel + 0.0022; }
    assembly.rotation.y = rotY;
    assembly.rotation.x += (rotX - assembly.rotation.x) * 0.12;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  };
  tick();
  window.__ready = true;
} else {
  renderer.render(scene, camera);
  window.__ready = true;
}
window.__shoot = (t) => {
  assembly.rotation.y = t * Math.PI * 2;
  renderer.render(scene, camera);
};
/* Probe handle for tooling: which mesh owns a pixel, so a shading artefact can
   be traced to a part instead of guessed at. Not used by the site. */
window.__probe = (nx, ny) => {
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(nx, ny), camera);
  return rc.intersectObjects(assembly.children, true).map((h) => ({
    geo: h.object.geometry.type,
    params: h.object.geometry.parameters ? JSON.stringify(h.object.geometry.parameters).slice(0, 90) : '',
    mat: h.object.material.color ? '#' + h.object.material.color.getHexString() : 'none',
    rough: h.object.material.roughness,
    metal: h.object.material.metalness,
    seg: h.object.geometry.parameters && (h.object.geometry.parameters.radialSegments || h.object.geometry.parameters.segments)
  }));
};
</script>
