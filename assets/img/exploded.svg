<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660" role="img" aria-labelledby="exTitle exDesc">
  <title id="exTitle">Exploded view of the Heartware insert inside a stethoscope chestpiece</title>
  <desc id="exDesc">Four separated layers from top to bottom: the stock diaphragm and rim, the chestpiece housing, the insert board with two microphone ports and a cell, and the back plate that the insert replaces.</desc>

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f6f0ee"/>
      <stop offset="0.45" stop-color="#cdbfbe"/>
      <stop offset="0.7" stop-color="#9a8789"/>
      <stop offset="1" stop-color="#6d5b5e"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8b797c"/>
      <stop offset="0.55" stop-color="#54454a"/>
      <stop offset="1" stop-color="#33242a"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f4e9e7"/>
      <stop offset="1" stop-color="#dccbcb"/>
    </linearGradient>
    <linearGradient id="polymer" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3a2229"/>
      <stop offset="0.6" stop-color="#221317"/>
      <stop offset="1" stop-color="#150a0e"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1c3670"/>
      <stop offset="1" stop-color="#0b1736"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d92"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2123b" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#e2123b" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#e2123b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5c0a1a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <ellipse cx="280" cy="350" rx="300" ry="300" fill="url(#halo)"/>

  <!-- exploded axis -->
  <line x1="280" y1="34" x2="280" y2="606" stroke="#e2123b" stroke-opacity="0.16" stroke-dasharray="2 8" stroke-width="1"/>

  <!-- ══ diaphragm + rim (stock) ══ -->
  <g filter="url(#soft)">
    <ellipse cx="280" cy="124" rx="152" ry="87" fill="url(#metal)"/>
    <ellipse cx="280" cy="124" rx="152" ry="87" fill="none" stroke="#a5908f" stroke-width="1.5"/>
    <ellipse cx="280" cy="120" rx="128" ry="73" fill="url(#pearl)" stroke="#dcc9c6" stroke-width="1"/>
    <ellipse cx="280" cy="120" rx="86" ry="49" fill="none" stroke="#d5c1be" stroke-width="1" opacity="0.85"/>
    <ellipse cx="280" cy="120" rx="44" ry="25" fill="none" stroke="#d5c1be" stroke-width="1" opacity="0.6"/>
    <path d="M 148 98 A 128 73 0 0 0 280 193" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <!-- ══ housing ══ -->
  <g filter="url(#soft)">
    <path d="M 128 272 A 152 87 0 0 0 432 272 L 432 318 A 152 87 0 0 1 128 318 Z" fill="url(#polymer)"/>
    <ellipse cx="280" cy="272" rx="152" ry="87" fill="#2a171d" stroke="#4b3037" stroke-width="1.5"/>
    <ellipse cx="280" cy="272" rx="130" ry="74" fill="#120a0d" stroke="#3a242b" stroke-width="1"/>
    <ellipse cx="280" cy="268" rx="130" ry="74" fill="url(#polymer)" opacity="0.55"/>
    <path d="M 128 272 A 152 87 0 0 0 432 272" fill="none" stroke="#6b4d54" stroke-width="2"/>
    <path d="M 150 266 A 130 74 0 0 0 280 340" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
    <!-- stem -->
    <path d="M 406 306 l 36 36 l -28 21 l -34 -36 z" fill="url(#metalDark)"/>
    <path d="M 408 308 l 34 34" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>

  <!-- ══ insert board ══ -->
  <g filter="url(#soft)">
    <path d="M 280 356 L 416 432 L 280 508 L 144 432 Z" fill="url(#board)" stroke="#25458a" stroke-width="1.5"/>
    <path d="M 280 364 L 402 432 L 280 500 L 158 432 Z" fill="none" stroke="#7f9dff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- traces -->
    <path d="M 200 462 L 280 506 L 360 462" fill="none" stroke="#ff7d92" stroke-width="1.6" stroke-opacity="0.75"/>
    <path d="M 222 446 L 280 478 L 338 446" fill="none" stroke="#ff7d92" stroke-width="1.2" stroke-opacity="0.5"/>
    <path d="M 280 366 L 280 470" stroke="#ff7d92" stroke-width="1" stroke-opacity="0.3"/>
    <!-- body port -->
    <g>
      <path d="M 214 404 l 0 -16 l 18 -10 l 0 16 z" fill="#a80c26"/>
      <ellipse cx="232" cy="394" rx="10" ry="5.6" fill="url(#redGrad)"/>
      <ellipse cx="232" cy="394" rx="4.4" ry="2.4" fill="#2b0009"/>
      <ellipse cx="232" cy="394" rx="17" ry="9.5" fill="none" stroke="#ff3d63" stroke-opacity="0.38"/>
    </g>
    <!-- reference port -->
    <g>
      <path d="M 336 466 l 0 -16 l 18 10 l 0 16 z" fill="#54454a"/>
      <ellipse cx="345" cy="476" rx="10" ry="5.6" fill="#9b8a8d"/>
      <ellipse cx="345" cy="476" rx="4.4" ry="2.4" fill="#1a1013"/>
    </g>
    <!-- cell -->
    <path d="M 352 404 l 38 22 l -28 16 l -38 -22 z" fill="#42323a" stroke="#6b5560" stroke-width="1.2"/>
    <path d="M 352 404 l 38 22 l 0 6 l -38 -22 z" fill="#2a1e24"/>
    <!-- radio -->
    <path d="M 272 384 l 34 19 l -26 15 l -34 -19 z" fill="#14224a" stroke="#3b5aa8" stroke-width="1"/>
    <circle cx="276" cy="400" r="2.6" fill="#ff3d63"/>
    <circle cx="276" cy="400" r="7" fill="none" stroke="#ff3d63" stroke-opacity="0.35"/>
  </g>

  <!-- ══ back plate ══ -->
  <g filter="url(#soft)">
    <path d="M 158 560 A 126 72 0 0 0 410 560 L 410 580 A 126 72 0 0 1 158 580 Z" fill="url(#metalDark)"/>
    <ellipse cx="284" cy="560" rx="126" ry="72" fill="url(#metal)" stroke="#ab9797" stroke-width="1.5"/>
    <ellipse cx="284" cy="560" rx="102" ry="58" fill="none" stroke="#b5a1a1" stroke-opacity="0.5" stroke-width="1"/>
    <ellipse cx="284" cy="560" rx="59" ry="34" fill="none" stroke="#b5a1a1" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M 190 534 A 102 58 0 0 0 284 617" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- ══ labels ══ -->
  <g font-family="'Instrument Sans', system-ui, sans-serif" font-size="17" font-weight="600" fill="#2a151c">
    <g stroke="#c8102e" stroke-opacity="0.35" stroke-dasharray="2 4">
      <path d="M 434 132 H 512"/>
      <path d="M 434 296 H 512"/>
      <path d="M 416 400 H 512"/>
      <path d="M 366 470 H 512"/>
      <path d="M 412 556 H 512"/>
    </g>
    <g>
      <text x="520" y="130">Diaphragm, stock</text>
      <text x="520" y="294">Housing</text>
      <text x="520" y="398">Body port</text>
      <text x="520" y="468">Reference port</text>
      <text x="520" y="554">Board, cell, radio</text>
    </g>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="400" fill="#8b6570" letter-spacing="0.04em">
      <text x="520" y="148">ACOUSTIC PATH UNCHANGED</text>
      <text x="520" y="312">SEALED CHAMBER</text>
      <text x="520" y="416">MEMS · 20 HZ – 2 KHZ</text>
      <text x="520" y="486">SEALED CAVITY · ROOM</text>
      <text x="520" y="572">DUAL CAPTURE · BLE 5.3</text>
    </g>
    <!-- back plate callout -->
    <g stroke="#c8102e" stroke-opacity="0.45" stroke-dasharray="2 4">
      <path d="M 152 560 H 78"/>
    </g>
    <text x="70" y="552" fill="#c8102e" font-size="17" text-anchor="end">Back plate,</text>
    <text x="70" y="572" fill="#c8102e" font-size="17" text-anchor="end">removed</text>
    <text x="70" y="592" fill="#8b6570" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="end" letter-spacing="0.04em">THE ONLY PART</text>
    <text x="70" y="605" fill="#8b6570" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="end" letter-spacing="0.04em">THAT LEAVES</text>
  </g>
</svg>
