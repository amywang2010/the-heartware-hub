<style>
  :root{--bg:#0B0509;--text:#F7EDEA;--muted:#C4AEB2;--red:#E2123B;--hot:#FF3D63;--line:rgba(255,255,255,.14)}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(60% 55% at 74% 28%,rgba(226,18,59,.3),transparent 68%),
      radial-gradient(70% 60% at 8% 90%,rgba(18,48,107,.55),transparent 62%),
      var(--bg);
    color:var(--text);font-family:"Instrument Sans",system-ui,sans-serif;padding:2rem;
  }
  main{max-width:600px}
  img{height:52px;width:auto;margin-bottom:2rem}
  .code{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hot)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.02;letter-spacing:-.035em;margin:1rem 0 1.2rem}
  h1 em{font-style:italic;color:var(--hot)}
  p{color:var(--muted);line-height:1.65;margin:0 0 2.2rem;max-width:42ch}
  a.btn{
    display:inline-block;padding:.95rem 1.5rem;border-radius:100px;
    background:linear-gradient(135deg,#FF3D63,#C8102E);color:#fff;text-decoration:none;
    font-size:.95rem;font-weight:600;box-shadow:0 12px 34px -12px rgba(226,18,59,.85);
  }
  a.alt{display:inline-block;margin-left:1.1rem;color:var(--muted);text-decoration:none;font-size:.9rem;border-bottom:1px solid var(--line);padding-bottom:2px}
  a.alt:hover{color:var(--text)}
</style>
</head>
<body>
<main>
  <a href="/"><img src="./assets/img/logo-mark-light.png" alt="Heartware"></a>
  <span class="code">404 · no signal</span>
